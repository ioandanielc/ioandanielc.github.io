<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} | {{ site.title }}</title>
<meta name="description" content="{{ page.summary | default: page.excerpt | strip_html | strip_newlines | truncate: 160 }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/blog/feed.xml">
{% if page.math %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body, {delimiters: [{left: '\\[', right: '\\]', display: true}, {left: '$$', right: '$$', display: true}, {left: '\\(', right: '\\)', display: false}]});"></script>
{% endif %}
</head>
<body>
<main>
  <a class="back" href="/blog/">&larr; All posts</a>
  <article>
    <h1>{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%-d %B %Y" }}</p>
    {{ content }}
  </article>
  <footer><a href="/">Ioan-Daniel Craciun</a> &middot; <a href="/blog/feed.xml">RSS</a></footer>
</main>
</body>
</html>
